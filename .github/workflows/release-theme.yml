name: Build & attach theme zip

# Fires when you push a tag like v1.0.1. It builds panonfc-theme.zip and
# attaches it to a GitHub Release for that tag. The theme's self-updater then
# offers the new version inside WordPress — no manual re-upload.
#
# Release the next version in one command:
#   1. bump `Version:` in panonfc-theme/style.css
#   2. git commit -am "Release 1.0.1"
#   3. git tag v1.0.1 && git push origin main --tags

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches style.css version
        run: |
          THEME_VERSION="$(grep -iE '^[[:space:]]*Version:' panonfc-theme/style.css | head -n1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "style.css: $THEME_VERSION | tag: $TAG_VERSION"
          if [ "$THEME_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match style.css Version ($THEME_VERSION). Bump style.css first."
            exit 1
          fi

      - name: Build zip
        run: |
          chmod +x bin/build-zip.sh
          bin/build-zip.sh "${{ github.workspace }}/panonfc-theme.zip"

      - name: Create / update release with asset
        uses: softprops/action-gh-release@v2
        with:
          name: PANONFC ${{ github.ref_name }}
          files: panonfc-theme.zip
          generate_release_notes: true
